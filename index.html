    }

      padding: 0;
      background: var(--bg);
      color: var(--ink);

    }

    h1,
    h2,
    h3,
    .serif{

    }

    .wrap{
      max-width: 1720px;
      margin: 0 auto;
      padding: 18px 16px 30px;
    }

    header{
      margin-bottom: 14px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 14px;
    }

    header h1{

      margin: 0 0 8px;
      line-height: 1.25;

      color: var(--muted);
    }

    }

    }

      color: var(--muted);

    }

      font-size: 0.85rem;

    }

      align-items: start;
    }

        grid-template-columns: 1fr;
      }
    }

    .diagram-holder{
      position: sticky;
      top: 14px;
    }

    @media (max-width:1100px){
      .diagram-holder{
        position: static;
      }
    }

      width: 100%;
      height: auto;
      display: block;
    }

       NODOS
    ====================================================== */

    .node-circle{
      fill: var(--panel);
      stroke-width: 2.5;
      cursor: pointer;
      transition:
        fill .15s,
        stroke-width .15s,
        stroke .15s;
    }

    .node-circle:hover{
      fill: #232c38;
    }

    .node-circle.selected{
      fill: #28323f;
      stroke-width: 4;
    }

    .node-label{
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
      color: var(--ink);
      font-family: 'IBM Plex Sans',sans-serif;
      pointer-events: none;
    }

    .node-num{
      fill: var(--ink);
      font-family: 'Source Serif 4',serif;
      font-size: 24px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      font-weight: 600;
    }

       POLOS STEAM / SOKA
    ====================================================== */

    .hub-circle{
      cursor: pointer;
      transition: filter .15s;
    }

    .hub-circle:hover{
      filter: brightness(1.15);
    }

    .hub-label{
      font-family: 'Source Serif 4',serif;
      font-weight: 700;
      font-size: 32px;
      fill: #0a0d11;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }


    /* ======================================================
       LÍNEAS
    ====================================================== */

    .edge{
      fill: none;
      stroke-linecap: round;
      transition:
        stroke-opacity .15s,
        stroke-width .15s;
    }

    .edge.dim{
      stroke-opacity: 0.12 !important;
    }

    .edge.lit{
      stroke-width: 3;
    }

       PANEL DERECHO
    ====================================================== */

      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 22px 24px;
      min-height: 320px;
    }

    .panel .placeholder{
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.94rem;
    }

    .panel .placeholder strong{
      color: var(--ink);
    }

      font-size: 1.28rem;
      margin: 0 0 14px;
      font-weight: 600;
      line-height: 1.3;
    }

    ====================================================== */

    .tags{

      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

      letter-spacing: .02em;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid;

      background: rgba(176,82,74,0.1);
    }

    .tag.convergencia{
      color: var(--convergencia);
      border-color: var(--convergencia);
      background: rgba(63,143,124,0.1);
    }

      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

      border-radius: 5px;
      padding: 13px 15px;
    }

      background: rgba(79,151,209,0.09);
      border-left: 3px solid var(--steam);
    }

    .view-block.soka-b{
      background: rgba(209,161,63,0.09);
      border-left: 3px solid var(--soka);
    }

      letter-spacing: .01em;
      color: var(--muted);
      font-weight: 500;
    }

      font-size: 0.89rem;
      line-height: 1.5;
    }

    ====================================================== */

      border-radius: 5px;
      padding: 13px 15px;
      margin-bottom: 12px;

      font-size: 0.76rem;
      font-weight: 600;
    }

      margin: 0;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .convergencia-box{
      border-left: 3px solid var(--convergencia);
      background: rgba(63,143,124,0.08);
    }

    .convergencia-box h4{
      color: var(--convergencia);
    }

    .tension-box{
      border-left: 3px solid var(--tension);
      background: rgba(176,82,74,0.08);
    }

    .tension-box h4{
      color: var(--tension);
    }

       RESUMEN GENERAL DE CADA MODELO
    ====================================================== */

      border-radius: 5px;
      padding: 16px 17px;
      margin-bottom: 16px;
    }

    .modelo-resumen.steam-modelo{
      background: rgba(79,151,209,0.09);
      border-left: 3px solid var(--steam);
    }

    .modelo-resumen.soka-modelo{
      background: rgba(209,161,63,0.09);
      border-left: 3px solid var(--soka);
    }

    .modelo-resumen h4{
      margin: 0 0 7px;
      font-size: 0.77rem;
      font-weight: 600;
    }

    .modelo-resumen.steam-modelo h4{
      color: var(--steam);
    }

    .modelo-resumen.soka-modelo h4{
      color: var(--soka);
    }

    .modelo-resumen p{
      margin: 0;
      font-size: 0.91rem;
      line-height: 1.58;
    }

      color: var(--muted);
      margin-top: -7px;
      margin-bottom: 17px;
      font-size: 0.84rem;
      line-height: 1.45;
    }

       APORTACIONES MUTUAS
    ====================================================== */

    .aportes-title{
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 500;
    }

    .aportes{
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .aporte-line{
      display: flex;
      gap: 9px;
      align-items: flex-start;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .arrow{
      flex-shrink: 0;
      font-family: 'Source Serif 4',serif;
      font-weight: 600;
      font-size: 0.8rem;
      padding-top: 1px;

    }

    }

    .arrow.a2{

    }

       FOOTER
    ====================================================== */

      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--panel-border);
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

  </style>
</head>

/* ==========================================================
   CONFIGURACIÓN SVG
========================================================== */

const svgNS = "http://www.w3.org/2000/svg";
const xhtmlNS = "http://www.w3.org/1999/xhtml";

const svg = document.getElementById("diagram");
const panel = document.getElementById("panel");

const steamHub = {
  x:440,
  y:98,
  r:80
};

const sokaHub = {
  x:440,
  y:982,
  r:80
};

const circleCenter = {
  x:440,
  y:540
};

const circleRadius = 200;


/* ==========================================================
   POSICIONES
========================================================== */

const positions = categorias.map((c,i)=>{

  const theta =
    (i / categorias.length) * Math.PI * 2;

  const x =
    circleCenter.x +
    circleRadius * Math.sin(theta);

  const y =
    circleCenter.y -
    circleRadius * Math.cos(theta);

  return {
    x,
    y,
    theta
  };

});


const sideByIndex = [
  "top",
  "right",
  "right",
  "right",
  "right",
  "bottom",
  "left",
  "left",
  "left",
  "left"
];


/* ==========================================================
   FUNCIÓN AUXILIAR SVG
========================================================== */

function el(tag,attrs){

  const e =
    document.createElementNS(svgNS,tag);

  for(const k in attrs){
    e.setAttribute(k,attrs[k]);
  }

  return e;

}


let selected = null;
let currentHub = null;

const edgeEls = [];
const labelDivs = [];

let steamLabelText = null;
let sokaLabelText = null;


const defs = el("defs",{});

svg.appendChild(defs);


/* ==========================================================
   ETIQUETA DE UN POLO (texto multilinea dentro del SVG)
========================================================== */

function setHubLabelText(textEl,hub,label){

  while(textEl.firstChild){
    textEl.removeChild(textEl.firstChild);
  }

  const lines =
    label.split("\n");

  const lineHeight = 34;

  lines.forEach((ln,idx)=>{

    const tspan =
      el("tspan",{
        x:hub.x,
        dy:
          idx === 0
            ? -((lines.length-1)*lineHeight)/2
            : lineHeight
      });

    tspan.textContent = ln;

    textEl.appendChild(tspan);

  });

}


/* ==========================================================
   DIBUJAR POLOS
========================================================== */

function drawHub(hub,color,label,modeloKey){

  const g =
    el("g",{});

  const circ =
    el("circle",{
      cx:hub.x,
      cy:hub.y,
      r:hub.r,
      fill:color,
      class:"hub-circle"
    });

  g.appendChild(circ);


  const t =
    el("text",{
      x:hub.x,
      y:hub.y,
      class:"hub-label"
    });

  setHubLabelText(t,hub,label);

  g.appendChild(t);


  /*
    Hacemos clicable todo el grupo,
    no únicamente el círculo.
  */

  g.style.cursor = "pointer";

  g.addEventListener(
    "click",
    ()=>showHub(modeloKey)
  );


  svg.appendChild(g);

  return t;

}


/* ==========================================================
   PUNTOS DE UNIÓN CON LOS POLOS
========================================================== */

function hubAttach(hub,i,n){

  const spreadDeg = 46;

  const angleDeg =
    -spreadDeg +
    i * (spreadDeg*2/(n-1));

  const facingDown =
    hub.y < 500;

  const rad =
    angleDeg * Math.PI/180;


  return {

    x:
      hub.x +
      hub.r * Math.sin(rad),

    y:
      hub.y +
      (facingDown ? 1 : -1) *
      hub.r *
      Math.cos(rad)

  };

}


/* ==========================================================
   CONEXIONES
========================================================== */

categorias.forEach((cat,i)=>{

  const p =
    positions[i];

  const aSteam =
    hubAttach(
      steamHub,
      i,
      categorias.length
    );

  const aSoka =
    hubAttach(
      sokaHub,
      i,
      categorias.length
    );


  const eSteam =
    el("line",{

      x1:p.x,
      y1:p.y,

      x2:aSteam.x,
      y2:aSteam.y,

      stroke:"#4f97d1",

      "stroke-opacity":0.3,

      "stroke-width":1.6,

      class:"edge"

    });


  const eSoka =
    el("line",{

      x1:p.x,
      y1:p.y,

      x2:aSoka.x,
      y2:aSoka.y,

      stroke:"#d1a13f",

      "stroke-opacity":0.3,

      "stroke-width":1.6,

      class:"edge"

    });


  svg.appendChild(eSteam);

  svg.appendChild(eSoka);


  edgeEls.push({

    steam:eSteam,

    soka:eSoka

  });

});


/* ==========================================================
   DIBUJAR STEAM Y SOKA
========================================================== */

steamLabelText = drawHub(
  steamHub,
  "#4f97d1",
  ui[currentLang].hubSteamLabel,
  "steam"
);


sokaLabelText = drawHub(
  sokaHub,
  "#d1a13f",
  ui[currentLang].hubSokaLabel,
  "soka"
);


/* ==========================================================
   DIBUJAR NODOS
========================================================== */

categorias.forEach((cat,i)=>{

  const p =
    positions[i];

  const g =
    el("g",{});


  const tipos =
    Array.isArray(cat.tipo)
      ? cat.tipo
      : [cat.tipo];


  let ringColor =
    "#5b6472";


  if(
    tipos.includes("convergencia") &&
    !tipos.includes("tension")
  ){

    ringColor =
      "#3f8f7c";

  }


  if(
    tipos.includes("tension") &&
    !tipos.includes("convergencia")
  ){

    ringColor =
      "#b0524a";

  }


  if(
    tipos.includes("convergencia") &&
    tipos.includes("tension")
  ){

    ringColor =
      "#8a8390";

  }


  const circ =
    el("circle",{

      cx:p.x,

      cy:p.y,

      r:44,

      stroke:ringColor,

      class:"node-circle",

      "data-i":i

    });


  g.appendChild(circ);


  const num =
    el("text",{

      x:p.x,

      y:p.y+1,

      class:"node-num"

    });


  num.textContent =
    cat.n;


  g.appendChild(num);


  const side =
    sideByIndex[i];


  let fx;
  let fy;

  let fw = 210;
  let fh = 68;

  let align = "center";


  if(side === "top"){

    fx = p.x-105;
    fy = p.y-118;

  }

  else if(side === "bottom"){

    fx = p.x-105;
    fy = p.y+50;

  }

  else if(side === "right"){

    fx = p.x+50;
    fy = p.y-33;

    fw = 180;
    fh = 70;

    align = "left";

  }

  else{

    fx = p.x-230;
    fy = p.y-33;

    fw = 180;
    fh = 70;

    align = "right";

  }


  const fo =
    el("foreignObject",{

      x:fx,

      y:fy,

      width:fw,

      height:fh

    });


  const div =
    document.createElementNS(
      xhtmlNS,
      "div"
    );


  div.setAttribute(
    "class",
    "node-label"
  );


  div.style.textAlign =
    align;


  div.textContent =
    cat[currentLang].nombre;


  fo.appendChild(div);

  g.appendChild(fo);

  labelDivs.push(div);


  g.style.cursor =
    "pointer";


  g.addEventListener(
    "click",
    ()=>selectCategory(i)
  );


  svg.appendChild(g);

});


/* ==========================================================
   LIMPIAR SELECCIÓN
========================================================== */

function clearSelection(){

  svg
    .querySelectorAll(".node-circle")
    .forEach(c =>
      c.classList.remove("selected")
    );


  edgeEls.forEach(pair=>{

    pair.steam.classList.remove(
      "dim",
      "lit"
    );

    pair.soka.classList.remove(
      "dim",
      "lit"
    );


    pair.steam.setAttribute(
      "stroke-opacity",
      0.3
    );

    pair.soka.setAttribute(
      "stroke-opacity",
      0.3
    );

  });

}


/* ==========================================================
   SELECCIONAR CATEGORÍA
========================================================== */

function selectCategory(i){

  clearSelection();

  selected = i;
  currentHub = null;


  svg
    .querySelectorAll(".node-circle")[i]
    .classList.add("selected");


  edgeEls.forEach((pair,idx)=>{

    if(idx === i){

      pair.steam.classList.add("lit");

      pair.steam.setAttribute(
        "stroke-opacity",
        0.9
      );


      pair.soka.classList.add("lit");

      pair.soka.setAttribute(
        "stroke-opacity",
        0.9
      );

    }

    else{

      pair.steam.classList.add("dim");

      pair.soka.classList.add("dim");

    }

  });


  const cat =
    categorias[i][currentLang];

  const t =
    ui[currentLang];


  const tipos =
    Array.isArray(categorias[i].tipo)
      ? categorias[i].tipo
      : [categorias[i].tipo];


  /* ========================================================
     ETIQUETAS
  ======================================================== */

  let tagsHTML = "";


  if(
    tipos.includes("convergencia")
  ){

    tagsHTML += `
      <span class="tag convergencia">
        ${t.labels.tagConvergencia}
      </span>
    `;

  }


  if(
    tipos.includes("tension")
  ){

    tagsHTML += `
      <span class="tag tension">
        ${t.labels.tagTension}
      </span>
    `;

  }


  /* ========================================================
     CONVERGENCIA Y TENSIÓN
  ======================================================== */

  let relacionesHTML = "";


  if(
    tipos.includes("convergencia") &&
    cat.encuentro
  ){

    relacionesHTML += `

      <div class="encuentro convergencia-box">

        <h4>
          ${t.labels.puntoEncuentro}
        </h4>

        <p>
          ${cat.encuentro}
        </p>

      </div>

    `;

  }


  if(
    tipos.includes("tension") &&
    cat.tension
  ){

    relacionesHTML += `

      <div class="encuentro tension-box">

        <h4>
          ${t.labels.tensionBox}
        </h4>

        <p>
          ${cat.tension}
        </p>

      </div>

    `;

  }


  /* ========================================================
     PANEL
  ======================================================== */

  panel.innerHTML = `

    <h2>
      ${categorias[i].n}. ${cat.nombre}
    </h2>


    <div class="tags">
      ${tagsHTML}
    </div>


    <div class="col2">

      <div class="view-block steam-b">

        <h4>
          ${t.labels.miradaSteam}
        </h4>

        <p>
          ${cat.steam}
        </p>

      </div>


      <div class="view-block soka-b">

        <h4>
          ${t.labels.miradaSoka}
        </h4>

        <p>
          ${cat.soka}
        </p>

      </div>

    </div>


    ${relacionesHTML}


    <div class="aportes-title">
      ${t.labels.aportesTitle}
    </div>


    <div class="aportes">

      <div class="aporte-line">

        <span class="arrow a1">
          STEAM → Soka
        </span>

        <span>
          ${cat.aporteSteamASoka}
        </span>

      </div>


      <div class="aporte-line">

        <span class="arrow a2">
          Soka → STEAM
        </span>

        <span>
          ${cat.aporteSokaASteam}
        </span>

      </div>

    </div>

  `;

}


/* ==========================================================
   MOSTRAR RESUMEN GENERAL STEAM / SOKA
========================================================== */

function showHub(modeloKey){

  clearSelection();

  selected = null;
  currentHub = modeloKey;


  const modelo =
    modelos[modeloKey][currentLang];

  const t =
    ui[currentLang];


  edgeEls.forEach(pair=>{

    if(modeloKey === "steam"){

      pair.steam.setAttribute(
        "stroke-opacity",
        0.85
      );

      pair.soka.classList.add(
        "dim"
      );

    }

    else{

      pair.soka.setAttribute(
        "stroke-opacity",
        0.85
      );

      pair.steam.classList.add(
        "dim"
      );

    }

  });


  const claseModelo =
    modeloKey === "steam"
      ? "steam-modelo"
      : "soka-modelo";


  panel.innerHTML = `

    <h2>
      ${modelo.nombre}
    </h2>


    <div class="modelo-claves">
      ${modelo.claves}
    </div>


    <div class="modelo-resumen ${claseModelo}">

      <h4>
        ${t.labels.principios}
      </h4>

      <p>
        ${modelo.resumen}
      </p>

    </div>


    <div class="encuentro">

      <h4>
        ${t.labels.relacionMapa}
      </h4>

      <p>
        ${t.labels.hubDesc}
      </p>

    </div>

  `;

}


/* ==========================================================
   PANEL INICIAL (SIN SELECCIÓN)
========================================================== */

function renderPlaceholder(){

  const t =
    ui[currentLang];

  panel.innerHTML = `

    <div class="placeholder">

      <p>
        <strong>${t.placeholder.strong}</strong>
        ${t.placeholder.p1}
      </p>

      <p>
        ${t.placeholder.p2}
      </p>

    </div>

  `;

}


/* ==========================================================
   APLICAR TEXTOS ESTÁTICOS DE INTERFAZ
========================================================== */

function applyStaticText(){

  const t =
    ui[currentLang];

  document.getElementById("htmlRoot").lang = currentLang;
  document.getElementById("docTitle").textContent = t.docTitle;
  document.getElementById("pageTitle").textContent = t.title;
  document.getElementById("pageSubtitle").textContent = t.subtitle;

  document.getElementById("legendSteam").textContent = t.legend.steam;
  document.getElementById("legendSoka").textContent = t.legend.soka;
  document.getElementById("legendConv").textContent = t.legend.conv;
  document.getElementById("legendTension").textContent = t.legend.tension;

  document.getElementById("langSelectLabel").textContent = t.langLabel;

  document.getElementById("footerText").innerHTML = t.footer;

}


/* ==========================================================
   CAMBIO DE IDIOMA
========================================================== */

function setLanguage(lang){

  if(lang !== "es" && lang !== "en"){
    return;
  }

  currentLang = lang;

  applyStaticText();

  setHubLabelText(
    steamLabelText,
    steamHub,
    ui[currentLang].hubSteamLabel
  );

  setHubLabelText(
    sokaLabelText,
    sokaHub,
    ui[currentLang].hubSokaLabel
  );

  categorias.forEach((cat,i)=>{
    labelDivs[i].textContent = cat[currentLang].nombre;
  });

  if(selected !== null){

    selectCategory(selected);

  }
  else if(currentHub !== null){

    showHub(currentHub);

  }
  else{

    renderPlaceholder();

  }

}


document
  .getElementById("langSelect")
  .addEventListener("change",(e)=>{
    setLanguage(e.target.value);
  });


/* ==========================================================
   ESTADO INICIAL (ESPAÑOL)
========================================================== */

applyStaticText();
renderPlaceholder();

</script>

</body>
</html>
